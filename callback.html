<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Connexion en cours…</title>
  <style>
    body {
      margin: 0;
      background: #080b10;
      color: #e8eaf0;
      font-family: 'Syne', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 20px;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(88,101,242,0.2);
      border-top-color: #5865F2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { color: #6b7280; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Connexion Discord en cours…</p>
  <script>
    // Cette page récupère le token du fragment d'URL
    // et le transmet à la page principale
    const hash = window.location.hash.substring(1);
    if (hash) {
      const params = new URLSearchParams(hash);
      const token = params.get("access_token");
      if (token) {
        // Stocker et rediriger vers la page principale
        localStorage.setItem("discord_token", token);
        const state = params.get("state");
        const returnUrl = "/" + (state ? `#state=${state}` : "");
        window.location.href = returnUrl;
      } else {
        window.location.href = "/";
      }
    } else {
      window.location.href = "/";
    }
  </script>
</body>
</html>
